<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCM Digital Songbook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <p class="header-tagline">We Preach Jesus The Living Saviour</p>
        <h1 class="main-title">UNITED CHURCH</h1>
        <h3 class="sub-title">Malkapuram</h3>
        <h2 class="retreat-title">CHRISTIAN ENDEAVOUR SOCIETY</h2>
        <p class="retreat-subtitle">Youth Retreat 2026</p>
    </header>

    <main class="container">
        <!-- Song List Container -->
        <div id="song-list" class="song-list-container"></div>

        <!-- Lyrics Viewing Box -->
        <div id="lyrics-box" style="display: none;"></div>
    </main>

    <!-- Presentation Overlay -->
    <div id="presentation-overlay" style="display: none;">
        <div class="pres-header">
            <span id="pres-title"></span>
            <div class="pres-controls">
                <button id="pres-play-btn" onclick="togglePlayPause()" title="Pause/Blank Screen">⏸️</button>
                <button id="pres-eye-btn" onclick="toggleTransliteration()" title="Hide English Transliteration">👁️</button>
                <button onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶</button>
                <button onclick="exitPresentation()" title="Exit Presentation">✕</button>
            </div>
        </div>

        <div id="pres-content"></div>

        <div class="pres-footer">
            <span id="pres-counter"></span>
            <span id="pres-upnext"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
